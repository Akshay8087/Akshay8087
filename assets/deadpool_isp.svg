<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620">
      <stop stop-color="#050505"/>
      <stop offset="0.5" stop-color="#111111"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>

    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF4D4D"/>
      <stop offset="1" stop-color="#B31217"/>
    </linearGradient>

    <linearGradient id="softPanel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#161616"/>
      <stop offset="1" stop-color="#0E0E0E"/>
    </linearGradient>

    <linearGradient id="whiteFade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D1D5DB"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glowRed" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#EF4444" flood-opacity="0.75"/>
    </filter>

    <style>
      .brandTiny {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        fill: #A1A1AA;
      }

      .hugeText {
        font-family: Impact, Arial Black, Segoe UI, sans-serif;
        font-size: 156px;
        font-weight: 900;
        letter-spacing: 4px;
        fill: rgba(255,255,255,0.96);
      }

      .nameText {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 34px;
        font-weight: 900;
        fill: #FFFFFF;
        letter-spacing: 1px;
      }

      .roleText {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #D4D4D8;
        letter-spacing: 1.4px;
      }

      .smallLabel {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 10px;
        font-weight: 800;
        fill: #A1A1AA;
        letter-spacing: 1.5px;
      }

      .metricValue {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 34px;
        font-weight: 900;
        fill: #FFFFFF;
      }

      .bodyText {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #D4D4D8;
      }

      .tag {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 11px;
        font-weight: 800;
        fill: #F4F4F5;
        letter-spacing: 1px;
      }

      .footerText {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 10px;
        font-weight: 800;
        fill: #A1A1AA;
        letter-spacing: 2px;
      }

      .float1 { animation: float1 5s ease-in-out infinite; }
      .float2 { animation: float2 6s ease-in-out infinite; }
      .pulse  { animation: pulse 2.4s ease-in-out infinite; }
      .slide  { animation: slide 2.5s ease-in-out infinite; }
      .spinSlow { transform-origin: 600px 340px; animation: spinSlow 14s linear infinite; }

      @keyframes float1 {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      @keyframes float2 {
        0%,100% { transform: translateY(-4px); }
        50% { transform: translateY(8px); }
      }

      @keyframes pulse {
        0%,100% { opacity: .65; }
        50% { opacity: 1; }
      }

      @keyframes slide {
        0%,100% { transform: translateX(0px); }
        50% { transform: translateX(7px); }
      }

      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Main background -->
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>

  <!-- Top band -->
  <rect x="0" y="0" width="1200" height="20" fill="#000000"/>

  <!-- Main card -->
  <g filter="url(#shadow)">
    <rect x="52" y="60" width="1096" height="520" rx="18" fill="#0B0B0B" stroke="#2A2A2A"/>
  </g>

  <!-- Big editorial text -->
  <text x="110" y="178" class="hugeText">ABOUT</text>
  <text x="690" y="178" class="hugeText">ME</text>

  <!-- Top mini labels -->
  <text x="86" y="102" class="brandTiny">PROFILE / PORTFOLIO</text>
  <text x="510" y="102" class="brandTiny">AKSHAY RATHOD</text>
  <text x="865" y="102" class="brandTiny">DATA • AI • BI</text>

  <!-- Red strip -->
  <rect x="52" y="208" width="1096" height="18" fill="url(#redGlow)"/>
  <g opacity="0.75">
    <circle cx="78" cy="217" r="3" fill="#111111"/>
    <circle cx="98" cy="217" r="3" fill="#111111"/>
    <circle cx="118" cy="217" r="3" fill="#111111"/>
    <circle cx="138" cy="217" r="3" fill="#111111"/>
    <circle cx="158" cy="217" r="3" fill="#111111"/>
    <circle cx="178" cy="217" r="3" fill="#111111"/>
    <circle cx="998" cy="217" r="3" fill="#111111"/>
    <circle cx="1018" cy="217" r="3" fill="#111111"/>
    <circle cx="1038" cy="217" r="3" fill="#111111"/>
    <circle cx="1058" cy="217" r="3" fill="#111111"/>
    <circle cx="1078" cy="217" r="3" fill="#111111"/>
    <circle cx="1098" cy="217" r="3" fill="#111111"/>
  </g>

  <!-- Center circle -->
  <circle cx="600" cy="380" r="154" stroke="#1F1F1F" stroke-width="2"/>
  <circle cx="600" cy="380" r="108" fill="#121212" stroke="#232323"/>

  <!-- Decorative orbit -->
  <g class="spinSlow" opacity="0.75">
    <circle cx="600" cy="262" r="5" fill="#EF4444"/>
    <circle cx="718" cy="380" r="5" fill="#FFFFFF"/>
    <circle cx="600" cy="498" r="5" fill="#EF4444"/>
    <circle cx="482" cy="380" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Center antihero-inspired original figure -->
  <g class="float1">
    <!-- head -->
    <circle cx="600" cy="292" r="34" fill="#171717"/>
    <path d="M572 290C580 272 594 264 600 264C606 264 620 272 628 290C617 282 608 279 600 279C592 279 583 282 572 290Z" fill="#B91C1C"/>
    <ellipse cx="588" cy="294" rx="7" ry="11" fill="#F4F4F5"/>
    <ellipse cx="612" cy="294" rx="7" ry="11" fill="#F4F4F5"/>

    <!-- torso -->
    <path d="M560 328C570 309 588 300 600 300C612 300 630 309 640 328L654 424H546L560 328Z" fill="#B91C1C"/>
    <path d="M586 300H614V424H586V300Z" fill="#141414"/>

    <!-- shoulders -->
    <path d="M546 338L512 355L520 370L556 352Z" fill="#141414"/>
    <path d="M654 338L688 355L680 370L644 352Z" fill="#141414"/>

    <!-- belt -->
    <rect x="560" y="384" width="80" height="18" rx="6" fill="#111111"/>
    <rect x="592" y="387" width="16" height="12" rx="2" fill="#9CA3AF"/>

    <!-- lower body -->
    <path d="M568 424H632L646 512H554L568 424Z" fill="#B91C1C"/>
    <path d="M590 424H610V512H590V424Z" fill="#141414"/>

    <!-- side utility -->
    <rect x="642" y="426" width="16" height="58" rx="6" fill="#8B5E3C"/>
    <rect x="654" y="452" width="14" height="40" rx="4" transform="rotate(24 654 452)" fill="#7C3AED"/>
  </g>

  <!-- Left info block -->
  <g class="float2">
    <text x="102" y="300" class="smallLabel">PROFILE</text>
    <rect x="102" y="320" width="116" height="116" rx="58" fill="#FFFFFF"/>
    <text x="160" y="364" text-anchor="middle" class="smallLabel" fill="#111111">EXPERIENCE</text>
    <text x="160" y="402" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="900" fill="#111111">2+</text>
  </g>

  <!-- Center metrics -->
  <g>
    <circle cx="535" cy="300" r="38" fill="#FFFFFF"/>
    <text x="535" y="293" text-anchor="middle" class="smallLabel" fill="#111111">FOCUS</text>
    <text x="535" y="319" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="900" fill="#111111">AI</text>

    <circle cx="600" cy="300" r="38" fill="#B91C1C" filter="url(#glowRed)"/>
    <text x="600" y="293" text-anchor="middle" class="smallLabel" fill="#FEE2E2">STACK</text>
    <text x="600" y="319" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">6</text>

    <circle cx="665" cy="300" r="38" fill="#171717"/>
    <text x="665" y="293" text-anchor="middle" class="smallLabel">CORE</text>
    <text x="665" y="319" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">BI</text>
  </g>

  <!-- Left logo-ish area -->
  <g>
    <text x="103" y="266" class="smallLabel">SPECIALIZATION</text>
    <rect x="102" y="273" width="110" height="28" rx="6" fill="#991B1B"/>
    <text x="157" y="292" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">
      DATA × AI
    </text>
  </g>

  <!-- Right text block -->
  <g>
    <rect x="875" y="286" width="4" height="74" fill="#B91C1C"/>
    <text x="890" y="296" class="smallLabel">ABOUT ME</text>
    <text x="890" y="320" class="bodyText">
      I am Akshay Rathod, a Data Analyst
    </text>
    <text x="890" y="340" class="bodyText">
      building intelligent solutions across
    </text>
    <text x="890" y="360" class="bodyText">
      SQL, Python, Machine Learning,
    </text>
    <text x="890" y="380" class="bodyText">
      Power BI, and business reporting.
    </text>
    <text x="890" y="400" class="bodyText">
      My work focuses on turning raw data
    </text>
    <text x="890" y="420" class="bodyText">
      into decision-ready insights and
    </text>
    <text x="890" y="440" class="bodyText">
      scalable analytics systems.
    </text>
  </g>

  <!-- Name / role -->
  <text x="430" y="470" class="nameText">AKSHAY RATHOD</text>
  <text x="430" y="495" class="roleText">DATA ANALYST • BI PROFESSIONAL • AI / ML PRACTITIONER</text>

  <!-- Tags -->
  <g class="pulse">
    <rect x="430" y="520" width="84" height="28" rx="14" fill="#1C1C1C" stroke="#333333"/>
    <text x="472" y="538" text-anchor="middle" class="tag">PYTHON</text>

    <rect x="522" y="520" width="60" height="28" rx="14" fill="#1C1C1C" stroke="#333333"/>
    <text x="552" y="538" text-anchor="middle" class="tag">SQL</text>

    <rect x="590" y="520" width="96" height="28" rx="14" fill="#1C1C1C" stroke="#333333"/>
    <text x="638" y="538" text-anchor="middle" class="tag">POWER BI</text>

    <rect x="694" y="520" width="108" height="28" rx="14" fill="#1C1C1C" stroke="#333333"/>
    <text x="748" y="538" text-anchor="middle" class="tag">PYTORCH</text>

    <rect x="810" y="520" width="82" height="28" rx="14" fill="#1C1C1C" stroke="#333333"/>
    <text x="851" y="538" text-anchor="middle" class="tag">MLOPS</text>
  </g>

  <!-- Left bottom tiny details -->
  <g>
    <circle cx="100" cy="470" r="9" stroke="#666666" stroke-width="1.5"/>
    <text x="100" y="474" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#A1A1AA">
      02
    </text>

    <circle cx="102" cy="502" r="3" fill="#B91C1C"/>
    <circle cx="112" cy="502" r="3" fill="#B91C1C"/>
    <circle cx="122" cy="502" r="3" fill="#B91C1C"/>
    <circle cx="132" cy="502" r="3" fill="#FFFFFF"/>
    <circle cx="142" cy="502" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Right mini dots -->
  <g>
    <circle cx="1040" cy="470" r="4" fill="#6B7280"/>
    <circle cx="1054" cy="470" r="4" fill="#D1D5DB"/>
    <circle cx="1068" cy="470" r="4" fill="#D1D5DB"/>
  </g>

  <!-- Top right utility buttons -->
  <g>
    <circle cx="1078" cy="102" r="10" fill="none" stroke="#D4D4D8"/>
    <path d="M1073 102H1083M1078 97V107" stroke="#D4D4D8" stroke-width="1.5" stroke-linecap="round"/>

    <circle cx="1104" cy="102" r="10" fill="#FFFFFF"/>
    <path d="M1099 102H1109" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>

    <circle cx="1130" cy="102" r="10" fill="#FFFFFF"/>
    <path d="M1126 98L1134 106M1134 98L1126 106" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Side vertical -->
  <text x="1125" y="255" transform="rotate(90 1125 255)" class="brandTiny">ABOUT SECTION</text>

  <!-- Bottom border accents -->
  <rect x="52" y="578" width="1096" height="2" fill="url(#redGlow)"/>

  <!-- Bottom right arrow -->
  <g class="slide">
    <path d="M1082 542L1102 522" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M1090 522H1102V534" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
