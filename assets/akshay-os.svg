<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="45%" stop-color="#EEF6FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>

    <style>
      .title {
        font-family: Segoe UI, Inter, Arial, sans-serif;
        font-size: 58px;
        font-weight: 800;
        fill: #0F172A;
      }

      .subtitle {
        font-family: Segoe UI, Inter, Arial, sans-serif;
        font-size: 22px;
        font-weight: 600;
        fill: #334155;
      }

      .small {
        font-family: Consolas, Monaco, monospace;
        font-size: 18px;
        fill: #475569;
      }

      .tiny {
        font-family: Segoe UI, Inter, Arial, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #475569;
      }

      .terminalText {
        font-family: Consolas, Monaco, monospace;
        font-size: 17px;
        fill: #E2E8F0;
      }

      .green {
        fill: #22C55E;
      }

      .blueText {
        fill: #38BDF8;
      }

      .orangeText {
        fill: #FDBA74;
      }

      .cursor {
        animation: blink 1s infinite;
      }

      @keyframes blink {
        0%, 45% { opacity: 1; }
        46%, 100% { opacity: 0; }
      }

      .float {
        animation: float 4s ease-in-out infinite;
      }

      .float2 {
        animation: float 5s ease-in-out infinite;
      }

      .float3 {
        animation: float 6s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: .45; r: 5; }
        50% { opacity: 1; r: 8; }
      }

      .dash {
        stroke-dasharray: 12 12;
        animation: dashMove 2.5s linear infinite;
      }

      @keyframes dashMove {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }

      .bar1 { animation: bar 2.2s ease-in-out infinite; transform-origin: bottom; }
      .bar2 { animation: bar 2.5s ease-in-out infinite; transform-origin: bottom; }
      .bar3 { animation: bar 2.1s ease-in-out infinite; transform-origin: bottom; }
      .bar4 { animation: bar 2.8s ease-in-out infinite; transform-origin: bottom; }

      @keyframes bar {
        0%, 100% { transform: scaleY(.45); }
        50% { transform: scaleY(1); }
      }

      .type1 { animation: show1 9s infinite; }
      .type2 { animation: show2 9s infinite; }
      .type3 { animation: show3 9s infinite; }

      @keyframes show1 {
        0%, 30% { opacity: 1; }
        31%, 100% { opacity: 0; }
      }

      @keyframes show2 {
        0%, 30% { opacity: 0; }
        31%, 65% { opacity: 1; }
        66%, 100% { opacity: 0; }
      }

      @keyframes show3 {
        0%, 65% { opacity: 0; }
        66%, 100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.35">
    <path d="M0 80H1200" stroke="#CBD5E1"/>
    <path d="M0 160H1200" stroke="#CBD5E1"/>
    <path d="M0 240H1200" stroke="#CBD5E1"/>
    <path d="M0 320H1200" stroke="#CBD5E1"/>
    <path d="M0 400H1200" stroke="#CBD5E1"/>
    <path d="M100 0V520" stroke="#CBD5E1"/>
    <path d="M250 0V520" stroke="#CBD5E1"/>
    <path d="M400 0V520" stroke="#CBD5E1"/>
    <path d="M550 0V520" stroke="#CBD5E1"/>
    <path d="M700 0V520" stroke="#CBD5E1"/>
    <path d="M850 0V520" stroke="#CBD5E1"/>
    <path d="M1000 0V520" stroke="#CBD5E1"/>
  </g>

  <!-- Main left content -->
  <text x="70" y="105" class="small">AKSHAYOS / DATA INTELLIGENCE SYSTEM</text>

  <text x="70" y="175" class="title">Akshay Rathod</text>
  <text x="70" y="215" class="subtitle">Data Scientist • AI/ML Engineer • Business Intelligence Analyst</text>

  <g class="type1">
    <text x="70" y="275" class="small">Building machine learning systems that explain business risk.</text>
  </g>

  <g class="type2">
    <text x="70" y="275" class="small">Transforming SQL + Python + Power BI into decision engines.</text>
  </g>

  <g class="type3">
    <text x="70" y="275" class="small">Learning PyTorch, Deep Learning, MLOps and Generative AI.</text>
  </g>

  <!-- Impact cards -->
  <g filter="url(#shadow)">
    <rect x="70" y="320" width="165" height="92" rx="22" fill="white"/>
    <text x="95" y="355" class="tiny">ML MODELS</text>
    <text x="95" y="390" font-family="Segoe UI, Arial" font-size="30" font-weight="800" fill="#2563EB">10+</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="255" y="320" width="165" height="92" rx="22" fill="white"/>
    <text x="280" y="355" class="tiny">BI REPORTS</text>
    <text x="280" y="390" font-family="Segoe UI, Arial" font-size="30" font-weight="800" fill="#10B981">15h/wk</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="320" width="190" height="92" rx="22" fill="white"/>
    <text x="465" y="355" class="tiny">FOCUS AREA</text>
    <text x="465" y="390" font-family="Segoe UI, Arial" font-size="28" font-weight="800" fill="#7C3AED">AI + BI</text>
  </g>

  <!-- Terminal window -->
  <g filter="url(#shadow)" class="float">
    <rect x="710" y="75" width="420" height="250" rx="24" fill="#0F172A"/>
    <rect x="710" y="75" width="420" height="48" rx="24" fill="#1E293B"/>
    <circle cx="742" cy="99" r="7" fill="#EF4444"/>
    <circle cx="766" cy="99" r="7" fill="#F59E0B"/>
    <circle cx="790" cy="99" r="7" fill="#22C55E"/>
    <text x="820" y="105" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#CBD5E1">akshay@github: profile</text>

    <text x="738" y="155" class="terminalText green">$ run profile.py</text>
    <text x="738" y="190" class="terminalText">Loading skills...</text>
    <text x="738" y="225" class="terminalText blueText">Python | SQL | Power BI | PyTorch</text>
    <text x="738" y="260" class="terminalText orangeText">Status: Building intelligent systems</text>
    <text x="738" y="295" class="terminalText">Impact mode activated</text>
    <rect x="930" y="280" width="10" height="22" fill="#E2E8F0" class="cursor"/>
  </g>

  <!-- Pipeline nodes -->
  <g class="float2">
    <circle cx="775" cy="410" r="30" fill="url(#blue)" filter="url(#shadow)"/>
    <text x="760" y="417" font-family="Segoe UI, Arial" font-size="20" font-weight="800" fill="white">SQL</text>

    <circle cx="900" cy="410" r="30" fill="url(#purple)" filter="url(#shadow)"/>
    <text x="883" y="417" font-family="Segoe UI, Arial" font-size="20" font-weight="800" fill="white">ML</text>

    <circle cx="1025" cy="410" r="30" fill="#10B981" filter="url(#shadow)"/>
    <text x="1006" y="417" font-family="Segoe UI, Arial" font-size="18" font-weight="800" fill="white">BI</text>

    <path d="M805 410 C835 385 840 385 870 410" stroke="#2563EB" stroke-width="4" fill="none" class="dash"/>
    <path d="M930 410 C960 385 965 385 995 410" stroke="#10B981" stroke-width="4" fill="none" class="dash"/>
  </g>

  <!-- Chart card -->
  <g filter="url(#shadow)" class="float3">
    <rect x="820" y="335" width="170" height="105" rx="22" fill="white"/>
    <text x="845" y="365" class="tiny">LIVE INSIGHTS</text>
    <rect x="850" y="402" width="18" height="28" rx="5" fill="#60A5FA" class="bar1"/>
    <rect x="880" y="388" width="18" height="42" rx="5" fill="#34D399" class="bar2"/>
    <rect x="910" y="374" width="18" height="56" rx="5" fill="#F97316" class="bar3"/>
    <rect x="940" y="392" width="18" height="38" rx="5" fill="#A78BFA" class="bar4"/>
  </g>

  <!-- Neural dots -->
  <g opacity="0.9">
    <circle cx="1065" cy="150" r="5" fill="#2563EB" class="pulse"/>
    <circle cx="1110" cy="185" r="5" fill="#7C3AED" class="pulse"/>
    <circle cx="1040" cy="230" r="5" fill="#10B981" class="pulse"/>
    <circle cx="1115" cy="260" r="5" fill="#F97316" class="pulse"/>

    <path d="M1065 150L1110 185L1040 230L1115 260" stroke="#94A3B8" stroke-width="2"/>
    <path d="M1065 150L1040 230" stroke="#94A3B8" stroke-width="2"/>
    <path d="M1110 185L1115 260" stroke="#94A3B8" stroke-width="2"/>
  </g>

  <!-- Bottom badge -->
  <g>
    <rect x="70" y="450" width="470" height="42" rx="21" fill="#0F172A"/>
    <text x="95" y="477" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#E2E8F0">
      Data → Models → Dashboards → Decisions → Business Impact
    </text>
  </g>

</svg>
