<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620">
      <stop stop-color="#EDE7E2"/>
      <stop offset="1" stop-color="#F7F4F1"/>
    </linearGradient>

    <!-- Card fills -->
    <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAFAFA"/>
    </linearGradient>

    <!-- Accent colors -->
    <linearGradient id="redAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#FF3B3B"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- Styles -->
    <style>
      .eyebrow {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 14px;
        font-weight: 700;
        fill: #1F2937;
      }

      .smallTop {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.8px;
        fill: #6B7280;
      }

      .heroTitle {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 22px;
        font-weight: 700;
        fill: #1F2937;
      }

      .heroBody {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #6B7280;
      }

      .panelTitle {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 18px;
        font-weight: 700;
        fill: #222222;
      }

      .panelBody {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #7A7A7A;
      }

      .footerLabel {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.8px;
        fill: #9CA3AF;
      }

      .skillTag {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #374151;
      }

      .float1 {
        animation: float1 5s ease-in-out infinite;
      }

      .float2 {
        animation: float2 6s ease-in-out infinite;
      }

      .float3 {
        animation: float3 7s ease-in-out infinite;
      }

      @keyframes float1 {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes float2 {
        0%,100% { transform: translateY(-4px); }
        50% { transform: translateY(7px); }
      }

      @keyframes float3 {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      .fadeDot {
        animation: fadeDot 2.8s ease-in-out infinite;
      }

      @keyframes fadeDot {
        0%,100% { opacity: .35; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>

  <!-- Main container -->
  <rect x="32" y="28" width="1136" height="564" rx="24" fill="#F2EEEA"/>

  <!-- Left panel -->
  <g filter="url(#softShadow)">
    <rect x="72" y="52" width="320" height="510" fill="url(#cardFill)"/>
  </g>

  <!-- Middle panel -->
  <g filter="url(#softShadow)">
    <rect x="440" y="52" width="320" height="510" fill="url(#cardFill)"/>
  </g>

  <!-- Right panel -->
  <g filter="url(#softShadow)">
    <rect x="808" y="52" width="320" height="510" fill="url(#cardFill)"/>
  </g>

  <!-- Top labels -->
  <text x="92" y="72" class="eyebrow">Skills</text>
  <text x="335" y="72" class="smallTop">01 / 03</text>

  <text x="460" y="72" class="eyebrow">Skills</text>
  <text x="703" y="72" class="smallTop">02 / 03</text>

  <text x="828" y="72" class="eyebrow">Skills</text>
  <text x="1071" y="72" class="smallTop">03 / 03</text>

  <!-- ================= LEFT PANEL ================= -->
  <!-- Abstract shape -->
  <g class="float1">
    <circle cx="232" cy="232" r="92" fill="url(#redAccent)"/>
    <circle cx="232" cy="232" r="42" fill="#1F2230"/>
    <circle cx="232" cy="232" r="16" fill="#FFFFFF"/>
  </g>

  <!-- Left icon -->
  <g transform="translate(190,177)">
    <circle cx="42" cy="18" r="14" fill="#F4C7B5"/>
    <path d="M25 39C32 28 52 28 59 39L67 82H17L25 39Z" fill="#EF4444"/>
    <path d="M18 57L4 20" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    <path d="M64 56L80 18" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    <path d="M31 81L24 134" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M54 81L61 134" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M21 136H34" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M58 136H69" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="232" y="410" text-anchor="middle" class="panelTitle">Analyze</text>
  <text x="232" y="437" text-anchor="middle" class="panelBody">
    Transform raw data into structured insights
  </text>
  <text x="232" y="455" text-anchor="middle" class="panelBody">
    using Python, SQL, and business analytics.
  </text>

  <!-- Tags -->
  <rect x="128" y="485" width="79" height="26" rx="13" fill="#F5F5F5"/>
  <text x="167.5" y="501" text-anchor="middle" class="skillTag">Python</text>

  <rect x="214" y="485" width="60" height="26" rx="13" fill="#F5F5F5"/>
  <text x="244" y="501" text-anchor="middle" class="skillTag">SQL</text>

  <rect x="281" y="485" width="61" height="26" rx="13" fill="#F5F5F5"/>
  <text x="311.5" y="501" text-anchor="middle" class="skillTag">EDA</text>

  <!-- Footer -->
  <circle cx="116" cy="535" r="4" fill="#111827"/>
  <circle cx="132" cy="535" r="4" fill="#D1D5DB"/>
  <circle cx="148" cy="535" r="4" fill="#D1D5DB"/>
  <text x="232" y="538" text-anchor="middle" class="footerLabel">SKILL SECTION</text>
  <path d="M328 535H360" stroke="#1F2937" stroke-width="2"/>
  <path d="M352 529L360 535L352 541" stroke="#1F2937" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= MIDDLE PANEL ================= -->
  <g class="float2">
    <path d="M536 148L650 262" stroke="url(#goldAccent)" stroke-width="34" stroke-linecap="square"/>
    <path d="M650 148L536 262" stroke="url(#goldAccent)" stroke-width="34" stroke-linecap="square"/>
  </g>

  <!-- Middle seated figure -->
  <g transform="translate(542,178)">
    <circle cx="63" cy="19" r="14" fill="#F4C7B5"/>
    <path d="M48 39C55 30 73 31 80 40L94 72L75 80L60 57L55 79L33 122H16L38 77L26 51L48 39Z" fill="#F59E0B"/>
    <path d="M57 79L88 118" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
    <path d="M38 121H20" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M88 118L106 136" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="600" y="410" text-anchor="middle" class="panelTitle">Build</text>
  <text x="600" y="437" text-anchor="middle" class="panelBody">
    Develop predictive solutions with machine
  </text>
  <text x="600" y="455" text-anchor="middle" class="panelBody">
    learning, modeling, and experimentation.
  </text>

  <rect x="489" y="485" width="79" height="26" rx="13" fill="#F5F5F5"/>
  <text x="528.5" y="501" text-anchor="middle" class="skillTag">ML</text>

  <rect x="575" y="485" width="84" height="26" rx="13" fill="#F5F5F5"/>
  <text x="617" y="501" text-anchor="middle" class="skillTag">PyTorch</text>

  <rect x="666" y="485" width="88" height="26" rx="13" fill="#F5F5F5"/>
  <text x="710" y="501" text-anchor="middle" class="skillTag">Models</text>

  <circle cx="484" cy="535" r="4" fill="#D1D5DB"/>
  <circle cx="500" cy="535" r="4" fill="#111827"/>
  <circle cx="516" cy="535" r="4" fill="#D1D5DB"/>
  <text x="600" y="538" text-anchor="middle" class="footerLabel">SKILL SECTION</text>
  <path d="M696 535H728" stroke="#1F2937" stroke-width="2"/>
  <path d="M720 529L728 535L720 541" stroke="#1F2937" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ================= RIGHT PANEL ================= -->
  <g class="float3">
    <path d="M926 300L1040 186" stroke="url(#purpleAccent)" stroke-width="34" stroke-linecap="square"/>
  </g>

  <!-- Right running figure -->
  <g transform="translate(930,168)">
    <circle cx="60" cy="20" r="14" fill="#6B4A3A"/>
    <path d="M46 40C54 31 69 31 78 40L95 58L112 72L101 87L82 74L72 94L49 88L58 66L45 55L46 40Z" fill="#D1D5DB"/>
    <path d="M72 94L104 124" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
    <path d="M54 88L28 116" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
    <path d="M103 124L118 144" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M26 117L10 132" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M80 42L88 18" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="968" y="410" text-anchor="middle" class="panelTitle">Deploy</text>
  <text x="968" y="437" text-anchor="middle" class="panelBody">
    Deliver business-ready systems through
  </text>
  <text x="968" y="455" text-anchor="middle" class="panelBody">
    dashboards, automation, and MLOps workflows.
  </text>

  <rect x="862" y="485" width="88" height="26" rx="13" fill="#F5F5F5"/>
  <text x="906" y="501" text-anchor="middle" class="skillTag">Power BI</text>

  <rect x="957" y="485" width="77" height="26" rx="13" fill="#F5F5F5"/>
  <text x="995.5" y="501" text-anchor="middle" class="skillTag">MLOps</text>

  <rect x="1041" y="485" width="59" height="26" rx="13" fill="#F5F5F5"/>
  <text x="1070.5" y="501" text-anchor="middle" class="skillTag">ETL</text>

  <circle cx="852" cy="535" r="4" fill="#D1D5DB"/>
  <circle cx="868" cy="535" r="4" fill="#D1D5DB"/>
  <circle cx="884" cy="535" r="4" fill="#111827"/>
  <text x="968" y="538" text-anchor="middle" class="footerLabel">SKILL SECTION</text>

  <!-- Expand icon inspired bottom-right -->
  <g transform="translate(1080,522)">
    <path d="M0 22L22 0" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 0H22V10" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Very subtle ambient dots -->
  <circle cx="104" cy="106" r="3" fill="#E5E7EB" class="fadeDot"/>
  <circle cx="595" cy="114" r="3" fill="#E5E7EB" class="fadeDot"/>
  <circle cx="1012" cy="120" r="3" fill="#E5E7EB" class="fadeDot"/>
</svg>
